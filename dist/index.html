<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
<meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
  <title>Status Bar Color</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Rettangolo colorato sotto la status bar -->
  <div id="status-fill"></div>

  <main>
    <h1> Status Bar Color </h1>
    <p id="current">Actual color: blue</p>

    <button id="btn-orange" class="btn orange">Status bar orange</button>
    <button id="btn-blue" class="btn blue">Status bar blue</button>
    <button id="btn-refresh" class="btn white">Refresh</button>
    <pre id="debug" class="debug"></pre>
    <div class="barra-bassa">
      <input type="text" class="campo" placeholder="Type here...">
      <div class="quadratino"></div>
    </div>
  </main>



  <script src="js/index.js"></script>
</body>
</html>
